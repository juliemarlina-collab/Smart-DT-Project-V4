<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Registration — Smart DT Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/smartdt.css"></head>
<body data-page="registration"><div class="app">
<header class="header"><a class="brand" href="welcome.html"><img class="brand-logo" src="assets/brand/brand-logo.png" alt="Smart DT logo"><span class="brand-text">Smart DT<br>Project</span></a><div class="header-actions"><span class="pill">EN</span><button class="icon-btn" aria-label="Menu"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div></header>
<main class="page no-nav">
  <section class="hero-card auth"><img src="assets/heroes/registration-hero.svg" alt="Registration header"></section>
  <section class="form-card"><h1 class="section-title" style="margin-top:0">Create your student profile</h1><p class="section-sub">This information is saved locally first so the dashboard and phase templates can personalise your Smart DT journey.</p>
    <form id="registrationForm" class="form-grid">
      <div class="field"><label>Full Name</label><input required class="input" name="df_student_name" placeholder="e.g. Nur Aina Binti Ahmad"></div>
      <div class="field"><label>Email Address</label><input required type="email" class="input" name="df_email" placeholder="student@polipd.edu.my"></div>
      <div class="mini-row"><div class="field"><label>Registration No.</label><input required class="input" name="df_reg_no" placeholder="e.g. 01DTK23F1001"></div><div class="field"><label>Class</label><input required class="input" name="df_class" placeholder="e.g. DTK5A"></div></div>
      <div class="field"><label>Project Title</label><input class="input" name="df_project_name" placeholder="e.g. Smart Queue System"></div>
      <div class="mini-row"><div class="field"><label>Team Name</label><input class="input" name="df_team" placeholder="e.g. Team Innovate"></div><div class="field"><label>Supervisor Name</label><input class="input" name="df_supervisor" placeholder="e.g. Ts. Dr. ..."></div></div>
      <button class="btn primary full" type="submit">Save & Continue</button>
    </form>
  </section>
  <p class="footer-note">Your data is stored in your browser for the current prototype version.</p>
</main></div><script src="js/smartdt.js"></script></body></html>
