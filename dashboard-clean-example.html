<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart DT Dashboard Clean Section</title>
  <link rel="stylesheet" href="../css/smartdt-responsive-fix.css"/>
</head>
<body>
  <main class="dashboard-container">
    <div class="dashboard-grid">

      <div class="dashboard-card">
        <h3>Submission Status</h3>
        <p><strong>Phase 01:</strong> Not Submitted</p>
        <p>Save your draft first, then submit when your team is ready.</p>
      </div>

      <div class="dashboard-card">
        <h3>Tasks &amp; To-Do</h3>
        <p>Complete Quick Info, Quiz, and Templates for the current phase.</p>
      </div>

      <div class="dashboard-card">
        <h3>Recent Activity</h3>
        <p>No recent activity yet. Start Phase 01 to create your first activity log.</p>
      </div>

    </div>
  </main>
</body>
</html>
